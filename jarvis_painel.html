<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.A.R.V.I.S. — Painel</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#050b12;color:#dff8ff;font-family:Arial,Helvetica,sans-serif}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  .panel{width:100vw;height:100vh;padding:4vh 5vw;position:relative;
    background:radial-gradient(circle at 50% 45%,#123044 0,#07131e 38%,#03070c 78%);
  }
  .top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #28566a;padding-bottom:14px}
  .brand{font-size:clamp(24px,4vw,52px);letter-spacing:.18em;color:#8eeaff;text-shadow:0 0 18px #20bce8}
  .status{font-size:clamp(12px,1.7vw,22px);color:#69e6b2;letter-spacing:.12em}
  .core{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
    width:min(32vw,300px);height:min(32vw,300px);border-radius:50%;
    border:2px solid #36d5ff;box-shadow:0 0 25px #0ab8e8, inset 0 0 35px #0a9bc4;
    display:flex;align-items:center;justify-content:center;
  }
  .core:before,.core:after{content:"";position:absolute;border-radius:50%;border:1px solid #57e6ff}
  .core:before{inset:12%;box-shadow:0 0 25px #21bce8}
  .core:after{inset:27%;border-color:#8df4ff}
  .arc{position:absolute;inset:-14%;border-radius:50%;border-top:3px solid transparent;border-right:3px solid #54eaff;transform:rotate(35deg)}
  .jarvis{z-index:2;text-align:center;font-weight:bold;font-size:clamp(20px,3vw,40px);letter-spacing:.15em}
  .cards{position:absolute;left:5vw;right:5vw;bottom:5vh;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{border:1px solid #24627a;border-radius:14px;padding:18px;background:rgba(5,20,30,.72);box-shadow:0 0 16px rgba(24,190,235,.12)}
  .label{font-size:13px;color:#62dff7;letter-spacing:.12em;text-transform:uppercase}
  .value{font-size:clamp(16px,2vw,28px);margin-top:8px}
  @media(max-width:700px){.cards{grid-template-columns:1fr}.core{width:190px;height:190px}.cards{bottom:2vh}.card{padding:10px}}
</style>
</head>
<body>
<main class="panel">
  <div class="top">
    <div class="brand">J.A.R.V.I.S.</div>
    <div class="status">● ONLINE</div>
  </div>

  <div class="core">
    <div class="arc"></div>
    <div class="jarvis">JARVIS</div>
  </div>

  <section class="cards">
    <div class="card"><div class="label">Sistema</div><div class="value">Painel principal ativo</div></div>
    <div class="card"><div class="label">Comando</div><div class="value">Aguardando Alexa</div></div>
    <div class="card"><div class="label">Destino</div><div class="value">Fire TV / Silk</div></div>
  </section>
</main>
</body>
</html>
